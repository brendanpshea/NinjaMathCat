name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Type-check
        run: npm run typecheck
      - name: Run the test suite
        env:
          # The runner ships with Chrome. If it ever does not, fail rather than
          # quietly skipping the real-browser tests.
          NINJA_REQUIRE_BROWSER: "1"
        run: npm test
