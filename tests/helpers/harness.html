<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ninja Math Cat test harness</title>
<!--
  Served by tests/helpers/browser.js. Loads the game in a frame, plays the
  scenario named in ?scenario=, and writes what it saw as JSON into #out for
  the test to read. Same origin as the game, so it can reach into the frame.
-->
</head>
<body>
<pre id="out">pending</pre>
<iframe id="game" style="width: 1000px; height: 900px; border: 0"></iframe>
<script type="module">
  const out = document.getElementById("out");
  const frame = document.getElementById("game");
  const errors = [];
  const wait = ms => new Promise(resolve => setTimeout(resolve, ms));

  async function until(test, what, ms = 60000) {
    const started = performance.now();
    while (!test()) {
      if (performance.now() - started > ms) throw new Error(`timed out waiting for ${what}`);
      await wait(25);
    }
  }

  /** Load the game in the frame, listening for errors in it. */
  async function load(query = "?test&seed=7") {
    const loaded = new Promise(resolve => { frame.onload = resolve; });
    frame.src = `/index.html${query}`;
    await loaded;
    const win = frame.contentWindow;
    win.addEventListener("error", e => errors.push(`error: ${e.message}`));
    win.addEventListener("unhandledrejection", e => errors.push(`rejection: ${e.reason}`));
    const consoleError = win.console.error.bind(win.console);
    win.console.error = (...args) => { errors.push(`console: ${args.join(" ")}`); consoleError(...args); };
    await until(() => win.ninjaMathCat, "the game to start");
    return win;
  }

  const doc = () => frame.contentDocument;
  const $ = selector => doc().querySelector(selector);
  const $$ = selector => [...doc().querySelectorAll(selector)];
  const game = () => frame.contentWindow.ninjaMathCat.state();
  const click = selector => { const el = $(selector); if (!el) throw new Error(`nothing matches ${selector}`); el.click(); };
  const text = selector => $(selector)?.textContent.replace(/\s+/g, " ").trim();
  const saved = () => JSON.parse(localStorage.getItem("ninja-math-cat"));
  const on = async (screen, what = screen) => until(() => game().screen === screen, what);

  /** On the battle screen, wait until a question can be answered, or the battle is over. */
  async function readyToAnswer() {
    await until(() => game().screen !== "battle"
      || ($(".choice:not(:disabled)") && $("[data-ref=next]").hidden && $(".prompt")?.textContent === game().battle?.question?.prompt),
    "a question to answer");
  }

  /** Answer the current question: rightly, or with the first wrong choice not tried. */
  async function answer(right) {
    const { battle } = game();
    const q = battle.question;
    const choice = right ? q.answer : q.choices.find(c => c !== q.answer && !battle.ruledOut.includes(c));
    $$(".choice")[q.choices.indexOf(choice)].click();
  }

  /** Answer rightly until the battle is over. */
  async function winBattle() {
    while (game().screen === "battle") {
      await readyToAnswer();
      if (game().screen !== "battle") break;
      await answer(true);
      await wait(20);
    }
  }

  /**
   * A save with one player, Maya, partway through the 3rd grade adventure:
   * the first `levels` levels done, some with fewer stars.
   */
  async function maya(levels = 21) {
    const { levelsFor } = await import("/src/adventures.js");
    const { TREASURES } = await import("/src/treasures.js");
    const done = Object.fromEntries(levelsFor(3).slice(0, levels).map((l, i) => [l.id, { stars: i % 4 === 1 ? 2 : 3, firstTry: 7, asked: 8 }]));
    return {
      players: [{ id: "p1", name: "Maya", heroId: "cat_ninja", grade: 3, xp: 2600, treasures: TREASURES.filter((_, i) => i % 3 === 0).map(t => t.id), adventures: { 3: { done, opened: 0 } } }],
      current: "p1",
      muted: false,
    };
  }

  /**
   * A save with one player, Sam, who has done every level before a chapter,
   * so its first level, and its opening, are next.
   * @param {string} id  the chapter's id
   */
  async function sceneSave(id) {
    const { ADVENTURE_GRADES, levelsFor, chaptersFor } = await import("/src/adventures.js");
    const grade = ADVENTURE_GRADES.find(g => chaptersFor(g).some(c => c.id === id));
    if (grade === undefined) throw new Error(`no chapter ${id}`);
    const chapter = chaptersFor(grade).findIndex(c => c.id === id);
    const done = Object.fromEntries(levelsFor(grade).filter(l => l.chapter < chapter).map(l => [l.id, { stars: 3, firstTry: 7, asked: 8 }]));
    return {
      players: [{ id: "p1", name: "Sam", heroId: "cat_ninja", grade, readAloud: false, xp: grade ? 2600 : 900, treasures: [], adventures: { [grade]: { done, opened: 0 } } }],
      current: "p1",
      muted: false,
    };
  }

  /**
   * Play a teaching scene inside a container through to its end: every
   * step, and each check tried a part or a choice at a time, last first,
   * until one is right.
   * @param {Element} box
   * @param {() => boolean} going  whether the scene is still showing
   */
  async function playScene(box, going) {
    const inBox = selector => box.querySelector(selector);
    const allInBox = selector => [...box.querySelectorAll(selector)];
    const lineText = () => inBox(".scene-line")?.textContent.trim() ?? "";
    const seen = { title: inBox("h1")?.textContent ?? "", steps: allInBox(".scene-steps li").length, checks: 0, wrongTries: 0, rings: 0, lines: [], problems: [] };
    for (let i = 0; i < 20 && going(); i++) {
      seen.lines.push(lineText());
      if (!lineText()) seen.problems.push(`scene "${seen.title}": a step with no line`);
      const shown = inBox("[data-ref=picture]");
      if (shown?.dataset.focus && !shown.querySelector(".focus")) seen.problems.push(`scene "${seen.title}": step ${i + 1} points at ${shown.dataset.focus}, but nothing is ringed`);
      seen.rings += shown?.querySelector(".focus") ? 1 : 0;
      const next = inBox("[data-ref=next]");
      if (next.disabled) {
        seen.checks++;
        const tries = allInBox(".scene-picture .tappable").length ? allInBox(".scene-picture .tappable") : allInBox(".scene-choices .choice");
        if (tries.length === 0) { seen.problems.push(`scene "${seen.title}": a check with nothing to tap or choose`); break; }
        for (const t of tries.reverse()) {
          t.dispatchEvent(new MouseEvent("click", { bubbles: true }));
          await wait(20);
          if (!next.disabled) break;
          seen.wrongTries++;
          if (!lineText()) seen.problems.push(`scene "${seen.title}": no pointer after a wrong try`);
        }
        if (next.disabled) { seen.problems.push(`scene "${seen.title}": no right answer to its check`); break; }
      }
      next.click();
      await wait(20);
    }
    return seen;
  }

  const scenarios = {
    /** A new player, from the title through a level and around the map, then a second player and a reload. */
    async adventure() {
      localStorage.clear();
      await load();
      const report = { title: {}, form: {}, map: {}, note: {}, battle: {}, done: {}, after: {}, progress: {}, training: {}, open: {}, treasures: {}, quick: {}, second: {}, reload: {} };

      report.title.heading = $("h1").textContent;
      report.title.players = $$("[data-player]").length;
      report.title.newPlayer = Boolean($("[data-ref=new-player]"));
      click("[data-ref=new-player]");

      await on("player", "the new player form");
      report.form.heading = $("h1").textContent;
      report.form.heroes = $$("input[name=hero]").length;
      report.form.grades = $$("input[name=grade]").length;
      $("[data-ref=name]").value = "  Sam  ";
      click(".hero-choice[data-hero=owl_wizard]");
      click("input[name=grade][value='2']");
      report.form.chapters = $$("[data-ref=practice] li").map(li => li.textContent);
      report.form.readAloud = $("[data-ref=read-aloud]")?.checked ?? null;
      click("[data-ref=save]");

      await on("map");
      report.map.heading = $("h1").textContent;
      report.map.levels = $$(".level-button").length;
      report.map.open = $$(".level-button.is-open").length;
      report.map.continue = text("[data-ref=continue]");
      click("[data-ref=continue]");

      // The chapter opens with its teaching scene; its note is a link away.
      await on("scene", "the chapter's opening scene");
      report.scene = { heading: $("h1").textContent, line: text(".scene-line"), steps: $$(".scene-steps li").length, noteLink: Boolean($("[data-ref=note]")) };
      click("[data-ref=note]");
      await on("note", "the chapter note");
      report.note.heading = $("h1").textContent;
      report.note.text = text(".note-text");
      report.note.example = text(".example-answer strong");
      report.note.read = Boolean($("[data-ref=read]"));
      $("[data-ref=read]")?.click();
      click("[data-ref=start]");

      await on("battle");
      await until(() => $$(".stage .sprite.is-ready").length === 2, "both sprites to load");
      report.battle.title = $(".journey-title").textContent;
      report.battle.journey = $$(".journey li").length;
      report.battle.arrival = $(".arrival").textContent;
      report.battle.heroName = $("[data-ref=heroName]").textContent;
      await readyToAnswer();
      report.battle.choices = $$(".choice").length;
      report.battle.read = Boolean($("[data-ref=read]"));
      $("[data-ref=read]")?.click();
      // Wrong twice: a hint, then the answer shown and a button to go on.
      await answer(false);
      await until(() => /Not quite/.test($(".feedback").textContent) && $(".choice:not(:disabled)"), "the hint, and the choices back");
      report.battle.hint = $(".feedback").textContent;
      report.battle.ruledOutDisabled = $$(".choice.wrong").every(b => b.disabled) && $$(".choice:not(:disabled)").length === 3;
      await answer(false);
      await until(() => !$("[data-ref=next]").hidden, "the Next button");
      report.battle.reveal = $(".feedback").textContent;
      report.battle.revealShowsRight = $$(".choice.right").length === 1;
      report.battle.nextFocused = doc().activeElement === $("[data-ref=next]");
      click("[data-ref=next]");
      // Then right until the level is done, watching the monster's health.
      let monsterHurt = false;
      let answered = 2;
      while (game().screen === "battle" && answered < 100) {
        await readyToAnswer();
        if (game().screen !== "battle") break;
        const before = Number($("[data-ref=monsterHp]").getAttribute("aria-valuenow"));
        await answer(true);
        answered++;
        await until(() => game().screen !== "battle" || Number($("[data-ref=monsterHp]").getAttribute("aria-valuenow")) < before
          || $("[data-ref=monsterName]").textContent !== game().battle?.foe?.monster.name, "the blow to land", 10000).catch(() => {});
        if (game().screen === "battle" && Number($("[data-ref=monsterHp]").getAttribute("aria-valuenow")) < before) monsterHurt = true;
      }
      report.battle.answered = answered;
      report.battle.monsterHurt = monsterHurt;

      await on("level-done", "the level's end");
      report.done.heading = $("h1").textContent;
      report.done.stars = $(".stars-big .stars").getAttribute("aria-label");
      report.done.facts = $$(".facts li").map(li => li.textContent.replace(/\s+/g, " ").trim());
      report.done.topicNote = text(".topic-note");
      report.done.next = text("[data-ref=next]");
      report.done.saved = saved();

      // The next level is practice: straight into battle, with no note.
      click("[data-ref=next]");
      await on("battle", "the next level");
      report.after.title = $(".journey-title").textContent;
      // The number keys answer, and leaving asks first.
      await readyToAnswer();
      const asked = game().battle.question;
      doc().dispatchEvent(new KeyboardEvent("keydown", { key: String(asked.choices.indexOf(asked.answer) + 1), bubbles: true }));
      await until(() => game().battle.question !== asked, "the number key to answer");
      report.after.keys = true;
      await readyToAnswer();
      click("[data-act=ask]");
      report.after.leaveAsks = text(".leave-ask");
      // While it asks, a number key answers nothing, and Escape keeps playing.
      const before = game().battle;
      doc().dispatchEvent(new KeyboardEvent("keydown", { key: "1", bubbles: true }));
      await wait(300);
      report.after.keysWaitWhileAsking = game().battle === before && Boolean($("[data-act=go]"));
      doc().dispatchEvent(new KeyboardEvent("keydown", { key: "Escape", bubbles: true }));
      report.after.escapeKeepsPlaying = Boolean($("[data-act=ask]")) && !$("[data-act=go]");
      click("[data-act=ask]");
      click("[data-act=go]");

      await on("map", "the map after leaving");
      report.after.firstLevel = $(".level-button").getAttribute("aria-label");
      report.after.secondLevel = $$(".level-button")[1].getAttribute("aria-label");
      report.after.count = text(".map-count");

      // The progress report, for grown-ups, then a training battle.
      click("[data-ref=report]");
      await on("report", "the progress report");
      report.progress.heading = $("h1").textContent;
      report.progress.rows = $$(".report-table tbody tr").length;
      report.progress.strengths = [...new Set($$(".report-table .strength").map(s => s.textContent))];
      click("[data-ref=training]");
      await on("battle", "a training battle");
      report.training.title = $(".journey-title").textContent;
      await winBattle();
      await on("training-done", "the end of training");
      report.training.heading = $("h1").textContent;
      report.training.facts = $$(".facts li").map(li => li.textContent.replace(/\s+/g, " ").trim());
      click("[data-ref=map]");
      await on("map", "the map after training");

      // A grown-up opens chapter 5 early.
      click(".chapter[data-chapter='4'] [data-act=open-ask]");
      report.open.asks = text(".chapter[data-chapter='4'] .open-ask");
      click(".chapter[data-chapter='4'] [data-act=open]");
      await until(() => !$(".chapter[data-chapter='4']").classList.contains("is-locked"), "chapter 5 to open");
      report.open.continue = text("[data-ref=continue]");
      report.open.earlierOpen = $$(".chapter[data-chapter='3'] .level-button").every(b => !b.disabled);
      report.open.laterLocked = $$(".chapter[data-chapter='5'] .level-button").every(b => b.disabled);

      click("[data-ref=treasures]");
      await on("treasures");
      report.treasures.heading = $("h1").textContent;
      report.treasures.found = $$(".treasure").length;
      report.treasures.missing = $$(".hidden-grid li").length;
      click("[data-ref=back]");
      await on("map", "the map again");

      click("[data-ref=quick]");
      await on("battle", "a quick battle");
      report.quick.title = $(".journey-title").textContent;
      report.quick.journey = $$(".journey li").length;
      await readyToAnswer();
      click("[data-act=ask]");
      click("[data-act=go]");
      await on("map", "the map after a quick battle");

      click("[data-ref=edit]");
      await on("player", "Sam's choices");
      report.second.editHeading = $("h1").textContent;
      click("[data-ref=code-out] [data-act=show]");
      const code = $("[data-ref=code-text]").value;
      report.second.code = code.slice(0, 5);
      click("[data-ref=back]");
      await on("map", "the map after the choices");

      // A second player, who starts in kindergarten.
      click("[data-ref=switch]");
      await on("title", "the title again");
      report.second.cards = $$("[data-player]").map(b => b.textContent.replace(/\s+/g, " ").trim());
      click("[data-ref=new-player]");
      await on("player", "the second new player");
      click("[data-ref=save]");
      await on("map", "the second player's map");
      report.second.heading = $("h1").textContent;

      // A new visit goes back to the last player's map, and remembers everyone.
      await load();
      report.reload.screen = game().screen;
      report.reload.heading = $("h1").textContent;
      click("[data-ref=switch]");
      await on("title", "the title after a reload");
      report.reload.cards = $$("[data-player]").length;

      // Sam comes over from "another device" by progress code; a bad code is turned away first.
      click("[data-ref=code-in] [data-act=ask]");
      $("[data-ref=code-text]").value = "not a code";
      click("[data-ref=code-in] [data-act=add]");
      report.reload.badCode = text("[data-ref=code-error]");
      $("[data-ref=code-text]").value = code;
      click("[data-ref=code-in] [data-act=add]");
      await on("map", "the map of the player brought over");
      report.reload.imported = $("h1").textContent;
      report.reload.importedCount = text(".map-count");
      report.reload.saved = saved();

      report.errors = errors;
      return report;
    },

    /**
     * Bring the game to one screen and stop there, for a screenshot
     * (tools/screenshots.js): ?screen= title, players, player, map, note,
     * battle, hint, reveal, level-done, victory or treasures, and ?width= and
     * ?height= for the frame.
     */
    async pose() {
      const params = new URLSearchParams(location.search);
      const screen = params.get("screen");
      out.hidden = true;
      document.body.style.margin = "0";
      frame.style.width = `${params.get("width") ?? 1000}px`;
      frame.style.height = `${params.get("height") ?? 900}px`;
      localStorage.clear();
      // A chapter's teaching scene (?chapter=), at a step (?step=, from 0), perhaps tried wrong once (?wrong).
      const sceneShot = screen === "scene";
      if (sceneShot || screen === "how") localStorage.setItem("ninja-math-cat", JSON.stringify(await sceneSave(params.get("chapter") ?? "0-teens")));
      else if (screen !== "title") localStorage.setItem("ninja-math-cat", JSON.stringify(await maya()));
      await load("?test&seed=11");
      if (screen === "how") {
        // "Show me how", open over the battle after the first question is missed twice.
        click("[data-ref=continue]");
        await on("scene");
        click("[data-ref=skip]");
        await on("battle");
        await until(() => $$(".stage .sprite.is-ready").length === 2, "both sprites to load");
        await readyToAnswer();
        await answer(false);
        await until(() => $(".choice:not(:disabled)") && /Not quite/.test($(".feedback").textContent), "the hint");
        await answer(false);
        await until(() => !$("[data-ref=next]").hidden, "the Next button");
        click("[data-ref=how]");
        await until(() => doc().querySelector("dialog.scene-dialog .still.is-ready"), "the scene to show how");
        await wait(400);
        return {};
      }
      if (sceneShot) {
        click("[data-ref=continue]");
        await on("scene");
        await until(() => $$(".scene-actor .still.is-ready").length === 2, "both stills to load");
        const tries = () => [...$$(".scene-picture .tappable"), ...$$(".scene-choices .choice:not(:disabled)")];
        for (let step = 0; step < Number(params.get("step") ?? 0); step++) {
          // A check on the way is answered, a part or choice at a time, until the scene can go on.
          for (const t of tries()) {
            if (!$("[data-ref=next]").disabled) break;
            t.dispatchEvent(new MouseEvent("click", { bubbles: true }));
            await wait(20);
          }
          click("[data-ref=next]");
          await wait(30);
        }
        // A wrong try, or a right one if the last part or choice happens to be right.
        if (params.has("wrong")) tries().pop()?.dispatchEvent(new MouseEvent("click", { bubbles: true }));
        await wait(400);
        return {};
      }
      await wait(300);
      switch (screen) {
        case "title": return {};
        case "players": click("[data-ref=switch]"); break;
        case "player": click("[data-ref=edit]"); break;
        case "map": break;
        case "note":
          // From the map, the chapter's scene, and from there its note.
          click(".chapter[data-chapter='4'] [data-act=note]");
          await on("scene");
          click("[data-ref=note]");
          break;
        case "treasures": click("[data-ref=treasures]"); break;
        case "report": click("[data-ref=report]"); break;
        case "victory":
          click("[data-ref=quick]");
          await on("battle");
          await winBattle();
          await on("victory");
          break;
        default: {
          // A level of the Area chapter, which has pictures.
          click("[data-ref=continue]");
          await on("battle");
          await until(() => $$(".stage .sprite.is-ready").length === 2, "both sprites to load");
          if (screen === "level-done") {
            await winBattle();
            await on("level-done");
            break;
          }
          for (let i = 0; i < 6; i++) {
            await readyToAnswer();
            if (i >= 1 && game().battle.question.visual) break;
            await answer(true);
            await wait(1500);
          }
          if (screen === "hint" || screen === "reveal") {
            await answer(false);
            await until(() => /Not quite/.test($(".feedback").textContent), "the hint");
            if (screen === "reveal") {
              await wait(1500);
              await answer(false);
              await until(() => !$("[data-ref=next]").hidden, "the Next button");
            }
          }
        }
      }
      await wait(1500);
      return {};
    },

    /** With reduced motion: nothing animates, and the game still plays. */
    async still() {
      localStorage.clear();
      localStorage.setItem("ninja-math-cat", JSON.stringify(await maya(1)));
      await load();
      click("[data-ref=continue]");
      await on("battle");
      const report = { answered: 0 };
      while (report.answered < 12) {
        if (game().screen === "level-done") click("[data-ref=next]");
        if (game().screen === "note") click("[data-ref=start]");
        if (game().screen !== "battle") await on("battle", "the next level");
        await readyToAnswer();
        if (game().screen !== "battle") continue;
        await answer(report.answered % 4 !== 0);
        report.answered++;
        await wait(20);
        if (!$("[data-ref=next]").hidden) click("[data-ref=next]");
      }
      report.reducedMotion = frame.contentWindow.matchMedia("(prefers-reduced-motion: reduce)").matches;
      report.xp = game().player.xp;
      report.errors = errors;
      return report;
    },

    /** "Show me how": a question missed twice, in a chapter with a teaching scene, and the scene over the battle. */
    async showHow() {
      localStorage.clear();
      localStorage.setItem("ninja-math-cat", JSON.stringify(await sceneSave("0-teens")));
      await load("?test&seed=5");
      const report = {};
      click("[data-ref=continue]");
      await on("scene");
      click("[data-ref=skip]");
      await on("battle");
      await readyToAnswer();
      report.type = game().battle.question.type;
      report.hiddenBefore = $("[data-ref=how]").hidden;
      await answer(false);
      await until(() => /Not quite/.test($(".feedback").textContent) && $(".choice:not(:disabled)"), "the hint");
      report.hiddenAfterOneMiss = $("[data-ref=how]").hidden;
      await answer(false);
      await until(() => !$("[data-ref=next]").hidden, "the Next button");
      report.offered = !$("[data-ref=how]").hidden;
      click("[data-ref=how]");
      await until(() => doc().querySelector("dialog.scene-dialog[open]"), "the scene to show how");
      const dialog = doc().querySelector("dialog.scene-dialog");
      report.kicker = dialog.querySelector(".note-kicker")?.textContent;
      report.onlyBack = !dialog.querySelector("[data-ref=skip], [data-ref=note], [data-ref=map]");
      report.last = "";
      const seen = await playScene(dialog, () => {
        if (dialog.isConnected) report.last = dialog.querySelector("[data-ref=next]")?.textContent ?? "";
        return dialog.isConnected;
      });
      report.scene = seen;
      report.closed = !dialog.isConnected;
      report.backInBattle = game().screen === "battle";
      report.focusOnNext = doc().activeElement === $("[data-ref=next]");
      const before = game().battle.question;
      click("[data-ref=next]");
      await readyToAnswer();
      report.goesOn = game().battle.question === before && $(".prompt").textContent === before.prompt && $("[data-ref=how]").hidden;
      report.errors = errors;
      return report;
    },

    /**
     * A whole grade's adventure played through the screens, for
     * tools/playthrough.js: every note read, most answers right, some wrong
     * once, now and then wrong twice. Run with ?grade=, and maybe ?levels=
     * and a ?width= for the screen, such as a phone's 390.
     */
    async marathon() {
      const params = new URLSearchParams(location.search);
      const grade = Number(params.get("grade") ?? 3);
      const most = Number(params.get("levels") ?? 99);
      if (params.get("width")) frame.style.width = `${params.get("width")}px`;
      localStorage.clear();
      localStorage.setItem("ninja-math-cat", JSON.stringify({
        players: [{ id: "p1", name: "Tester", heroId: "cat_ninja", grade, readAloud: false, xp: 0, treasures: [], adventures: {} }],
        current: "p1",
        muted: true,
      }));
      await load(`?test&seed=${grade * 7 + 3}`);
      const report = { levels: 0, questions: 0, wrongOnce: 0, wrongTwice: 0, notes: [], kinds: {}, problems: [], screens: [] };
      const problem = what => { if (report.problems.length < 40) report.problems.push(what); };
      let roll = grade * 97 + 13;
      const chance = p => ((roll = (roll * 16807) % 2147483647) / 2147483647) < p;
      await on("map");
      click("[data-ref=continue]");
      report.scenes = [];
      report.replays = [];

      while (report.levels < most) {
        await until(() => ["note", "scene", "battle"].includes(game().screen), "a note, a scene or a battle");
        if (game().screen === "scene") {
          const seen = await playScene(doc().querySelector(".scene-screen"), () => game().screen === "scene");
          seen.problems.forEach(problem);
          if (game().screen !== "battle") problem(`scene "${seen.title}" did not lead into the battle`);
          report.scenes.push(seen);
        }
        if (game().screen === "note") {
          report.notes.push({ heading: $("h1").textContent, example: Boolean(text(".example-answer strong")) });
          if (!text(".note-text") || !text(".example-answer strong")) problem(`note "${$("h1").textContent}" has no text or example`);
          click("[data-ref=start]");
          await on("battle");
        }
        const title = text(".journey-title");
        while (game().screen === "battle") {
          await readyToAnswer();
          if (game().screen !== "battle") break;
          const q = game().battle.question;
          report.questions++;
          const where = `${title}: ${q.prompt}`;
          if ($$(".choice").length !== 4 || $$(".choice-text").some(c => !c.textContent.trim())) problem(`${where}: choices missing or blank`);
          if (q.visual) {
            report.kinds[q.visual.kind] = (report.kinds[q.visual.kind] ?? 0) + 1;
            const picture = $(".picture svg");
            if (!picture) problem(`${where}: no picture drawn for ${q.visual.kind}`);
            else if (!picture.getAttribute("aria-label")) problem(`${where}: picture with no label`);
            else if (picture.getBoundingClientRect().width < 100) problem(`${where}: picture only ${Math.round(picture.getBoundingClientRect().width)}px wide`);
          } else if ($(".picture svg")) problem(`${where}: a picture left over from the last question`);
          const page = doc().documentElement;
          if (page.scrollWidth > page.clientWidth + 1) problem(`${where}: the page scrolls sideways, ${page.scrollWidth}px in ${page.clientWidth}px`);
          if (chance(0.8)) {
            await answer(true);
          } else if (chance(0.75)) {
            report.wrongOnce++;
            await answer(false);
            await until(() => /Not quite/.test($(".feedback").textContent) && $(".choice:not(:disabled)"), "the hint");
            if (!text(".feedback")) problem(`${where}: no hint shown`);
            await answer(true);
          } else {
            report.wrongTwice++;
            await answer(false);
            await until(() => /Not quite/.test($(".feedback").textContent) && $(".choice:not(:disabled)"), "the hint");
            await answer(false);
            await until(() => !$("[data-ref=next]").hidden, "the Next button");
            if ($$(".choice.right").length !== 1) problem(`${where}: the right answer is not shown`);
            // Where a teaching scene can show how, watch it, over the battle, and come back.
            const how = $("[data-ref=how]");
            if (how && !how.hidden) {
              how.click();
              await until(() => doc().querySelector("dialog.scene-dialog[open]"), "the scene to show how");
              const dialog = doc().querySelector("dialog.scene-dialog");
              const seen = await playScene(dialog, () => dialog.isConnected);
              seen.problems.forEach(problem);
              if (dialog.isConnected) problem(`${where}: the scene that shows how did not close`);
              if (game().screen !== "battle") problem(`${where}: showing how left the battle`);
              report.replays.push(seen.title);
            }
            click("[data-ref=next]");
          }
          await wait(20);
        }
        await until(() => game().screen !== "battle", "the battle's end");
        report.screens.push(game().screen);
        if (game().screen !== "level-done") { problem(`after ${title}: ${game().screen}, not the level's end`); break; }
        report.levels++;
        const next = $("[data-ref=next]");
        if (!next) break;
        next.click();
        await until(() => game().screen !== "level-done", "leaving the level's end");
        if (game().screen === "map") {
          if (!$("[data-ref=continue]")) break;
          click("[data-ref=continue]");
        }
      }
      report.finalScreen = game().screen;
      report.saved = Object.keys(saved().players[0].adventures?.[grade]?.done ?? {}).length;
      report.xp = game().player.xp;
      report.errors = errors;
      return report;
    },
  };

  try {
    const name = new URLSearchParams(location.search).get("scenario");
    out.textContent = JSON.stringify(await scenarios[name]());
  } catch (error) {
    out.textContent = JSON.stringify({ error: `${error.message} (errors seen: ${errors.join(" | ") || "none"})` });
  }
</script>
</body>
</html>
